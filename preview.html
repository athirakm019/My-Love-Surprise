<body class="bg-[#FFF9FB] text-slate-800 antialiased selection:bg-pink-300 selection:text-pink-900 overflow-x-hidden">

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Romantic Audio Synthesizer (Web Audio API)
    class AudioSynth {
      constructor() {
        this.ctx = null;
        this.isSynthesizing = false;
        this.timerId = null;
        this.volumeNode = null;
        this.masterVolume = 0.65;
        this.isMuted = false;
        this.step = 0;
        this.chords = [
          [174.61, 220.00, 261.63, 329.63, 392.00, 523.25], // Fmaj7
          [130.81, 164.81, 196.00, 246.94, 293.66, 392.00], // Cmaj7
          [146.83, 174.61, 220.00, 261.63, 349.23, 440.00], // Dm7
          [116.54, 146.83, 174.61, 233.08, 293.66, 349.23], // Bbmaj7
        ];
        this.melodyNotes = [523.25, 587.33, 659.25, 587.33, 523.25, 440.00, 392.00, 440.00];
      }

      init() {
        if (!this.ctx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContextClass();
          this.volumeNode = this.ctx.createGain();
          this.volumeNode.gain.setValueAtTime(this.masterVolume, this.ctx.currentTime);
          this.volumeNode.connect(this.ctx.destination);
        }
        if (this.ctx.state === 'suspended') this.ctx.resume();
      }

      playTone(freq, duration, gainVal, delay = 0) {
        if (!this.ctx || !this.volumeNode) return;
        const osc = this.ctx.createOscillator();
        const noteGain = this.ctx.createGain();
        const filter = this.ctx.createBiquadFilter();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime + delay);
        filter.type = 'lowpass';
        filter.frequency.setValueAtTime(850, this.ctx.currentTime + delay);

        const t = this.ctx.currentTime + delay;
        noteGain.gain.setValueAtTime(0.0001, t);
        noteGain.gain.exponentialRampToValueAtTime(gainVal * 0.35, t + 0.08);
        noteGain.gain.exponentialRampToValueAtTime(gainVal * 0.15, t + 0.4);
        noteGain.gain.exponentialRampToValueAtTime(0.0001, t + duration);

        osc.connect(filter);
        filter.connect(noteGain);
        noteGain.connect(this.volumeNode);
        osc.start(t);
        osc.stop(t + duration + 0.1);
      }

      schedule = () => {
        if (!this.isSynthesizing || !this.ctx) return;
        const chordIndex = Math.floor(this.step / 8) % this.chords.length;
        const chord = this.chords[chordIndex];
        const beat = this.step % 8;

        if (beat === 0) {
          this.playTone(chord[0], 2.8, 0.45);
          this.playTone(chord[1], 2.5, 0.35, 0.1);
          this.playTone(chord[2], 2.2, 0.3, 0.2);
        }
        const midIndex = (beat % (chord.length - 2)) + 2;
        this.playTone(chord[midIndex], 1.8, 0.2);

        if (this.step % 2 === 0) {
          const mIdx = (this.step / 2) % this.melodyNotes.length;
          this.playTone(this.melodyNotes[mIdx], 1.5, 0.15, 0.25);
        }

        this.step++;
        this.timerId = setTimeout(this.schedule, 450);
      }

      play() {
        this.init();
        if (this.isSynthesizing) return;
        this.isSynthesizing = true;
        this.schedule();
      }

      pause() {
        this.isSynthesizing = false;
        if (this.timerId) clearTimeout(this.timerId);
      }

      setVolume(val) {
        this.masterVolume = val;
        if (this.volumeNode && this.ctx && !this.isMuted) {
          this.volumeNode.gain.setValueAtTime(val, this.ctx.currentTime);
        }
      }

      toggleMute() {
        this.isMuted = !this.isMuted;
        if (this.volumeNode && this.ctx) {
          this.volumeNode.gain.setValueAtTime(this.isMuted ? 0 : this.masterVolume, this.ctx.currentTime);
        }
        return this.isMuted;
      }
    }

    const audio = new AudioSynth();

    const triggerPinkFireworks = () => {
      if (typeof confetti !== 'function') return;
      confetti({
        particleCount: 75,
        spread: 100,
        origin: { x: 0.5, y: 0.4 },
        colors: ['#FF69A6', '#FFB6D5', '#E84383', '#F5DFA5', '#FFFFFF'],
        scalar: 1.3
      });
    };

    const triggerExplosion = (x = 0.5, y = 0.5) => {
      if (typeof confetti !== 'function') return;
      confetti({
        particleCount: 50,
        spread: 80,
        origin: { x, y },
        colors: ['#FF69A6', '#E84383', '#FFB6D5', '#F5DFA5', '#FFFFFF'],
        scalar: 1.2
      });
    };

    // Main App Component
    function App() {
      const [isOpened, setIsOpened] = useState(false);
      const [loveCount, setLoveCount] = useState(143);
      const [isPlaying, setIsPlaying] = useState(false);
      const [isMuted, setIsMuted] = useState(false);
      const [volume, setVolume] = useState(0.65);
      const [isSecretOpen, setIsSecretOpen] = useState(false);
      const [secretClicks, setSecretClicks] = useState(0);
      const [isLetterOpen, setIsLetterOpen] = useState(false);
      const [activeLightbox, setActiveLightbox] = useState(null);
      const [isAdminOpen, setIsAdminOpen] = useState(false);
      const [isAdminAuthed, setIsAdminAuthed] = useState(false);
      const [adminPass, setAdminPass] = useState('');
      const [photos, setPhotos] = useState([
        { id: 1, caption: "Your Gentle Smile ✨", isFavorite: true, url: "https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&w=800&q=80" },
        { id: 2, caption: "My Safe Place 🤍", isFavorite: false, url: "https://images.unsplash.com/photo-1506794778202-cad84cf45f1d?auto=format&fit=crop&w=800&q=80" },
        { id: 3, caption: "Our Fun Adventures 🌸", isFavorite: false, url: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=800&q=80" },
        { id: 4, caption: "Your Gorgeous Eyes 💫", isFavorite: false, url: "https://images.unsplash.com/photo-1500648767791-00dcc994a43e?auto=format&fit=crop&w=800&q=80" },
        { id: 5, caption: "My Dream Boy 👑", isFavorite: false, url: "https://images.unsplash.com/photo-1492562080023-ab3db95bfbce?auto=format&fit=crop&w=800&q=80" },
        { id: 6, caption: "Endless Laughs Together 🥰", isFavorite: false, url: "https://images.unsplash.com/photo-1519085360753-af0119f7cbe7?auto=format&fit=crop&w=800&q=80" },
      ]);

      const handleOpen = () => {
        setIsOpened(true);
        audio.play();
        setIsPlaying(true);
        triggerPinkFireworks();

      const handleToggleMusic = () => {
        if (isPlaying) {

          setIsPlaying(false);
        } else {
          audio.play();
          setIsPlaying(true);
        }

      const handleSecret = (e) => {
        const next = secretClicks + 1;
        setSecretClicks(next);
        triggerExplosion(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
        if (next >= 3) {
          setIsSecretOpen(true);
          setSecretClicks(0);
        }
      };

      const handlePhotoUpload = (e) => {
        const files = e.target.files;
        if (!files) return;
        const newItems = [];
        for (let i = 0; i < files.length; i++) {
          const file = files[i];
          const reader = new FileReader();
          reader.onload = (ev) => {
            setPhotos(prev => [{
              id: Date.now() + i,
              caption: file.name.replace(/\.[^/.]+$/, '').replace(/[-_]/g, ' '),
              isFavorite: prev.length === 0 && i === 0,
              url: ev.target.result
            }, ...prev]);

          reader.readAsDataURL(file);
        }
      };

      const favoritePhoto = photos.find(p => p.isFavorite) || photos[0];

      return (
        <div className="min-h-screen relative font-sans text-slate-800">
          {/* Ambient Particles */}
          <div className="fixed inset-0 pointer-events-none z-10 overflow-hidden">
            {[...Array(18)].map((_, i) => (
              <span
                key={i}
                className="absolute animate-float-particle select-none"
                style={{
                  left: `${(i * 5.8) % 96}%`,

                  opacity: 0.55
                }}
              >
                {['💗', '✨', '🌸', '🦋', '🌹', '💖', '🥰'][i % 7]}

            ))}
          </div>

          {/* OPENING SCREEN */}
          {!isOpened && (
            <div className="fixed inset-0 z-50 flex flex-col items-center justify-center px-4 bg-gradient-to-b from-[#FFF0F6] via-[#FFD6E7] to-[#FFB6D5]">
              <div className="text-center max-w-xl animate-bounce">
                <span className="inline-block px-4 py-1.5 rounded-full bg-white/80 border border-pink-200 text-xs sm:text-sm font-semibold text-[#E84383] mb-3">
                  💗 A Special Love Surprise Just For You 💗

                    { title: "The Day We First Met 💫", date: "The Start of Forever", desc: "My heart knew right from that first conversation that you were someone truly special.", sticker: "🎀" },

                    triggerExplosion(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
                  }}
                  className="px-8 sm:px-14 py-6 sm:py-8 rounded-full bg-gradient-to-r from-[#FF69A6] via-[#E84383] to-[#FF4D8D] text-white shadow-2xl hover:shadow-pink-400/80 transition-all transform hover:scale-108 active:scale-95 border-4 border-white font-serif font-extrabold text-xl sm:text-2xl animate-heartbeat"
                >
                  CLICK HERE FOR UNLIMITED LOVE 💗
                </button>
              </div>
              <p className="font-handwriting text-2xl sm:text-3xl text-[#E84383] mt-6 font-bold">
                "Sending you unlimited hugs, kisses and love! 😘💋"
              </p>
            </section>

            {/* FINAL MAGICAL SURPRISE */}
            <section className="min-h-screen py-24 px-4 flex flex-col items-center justify-center text-center bg-gradient-to-b from-[#FFF5F8] via-[#FFD6E7] to-[#FFB6D5]">
              <span className="font-handwriting text-3xl sm:text-4xl text-[#E84383] font-bold mb-4">
                My Prince Forever 👑
              </span>

              {/* Glowing Heart Frame */}
              <div onClick={triggerPinkFireworks} className="relative w-64 h-64 sm:w-80 sm:h-80 rounded-full p-2.5 bg-gradient-to-tr from-[#F5DFA5] via-[#FF69A6] to-[#E84383] shadow-2xl flex items-center justify-center animate-heartbeat cursor-pointer mb-8">
                <img src={favoritePhoto.url} alt={favoritePhoto.caption} className="w-full h-full rounded-full object-cover border-4 border-white" />
              </div>

              <div className="space-y-6 max-w-4xl px-4">
                <div className="p-4 rounded-3xl bg-white/70 shadow border border-pink-200">
                  <p className="font-serif font-bold text-2xl sm:text-4xl text-[#E84383] glow-pink-text">
                    YOU ARE MY TODAY, MY TOMORROW AND MY FOREVER. 💗
                  </p>
                </div>
                <div className="p-4 rounded-3xl bg-white/70 shadow border border-pink-200">
                  <p className="font-handwriting text-2xl sm:text-4xl text-slate-800 font-bold">
                    If I could choose again, I would still choose YOU. ❤️
                  </p>
                </div>
                <div className="p-5 rounded-3xl bg-gradient-to-r from-pink-500/10 via-rose-500/20 to-pink-500/10 border-2 border-pink-300 shadow">
                  <p className="font-cursive text-4xl sm:text-6xl text-[#E84383] glow-pink-text font-bold">
                    I LOVE YOU MORE THAN WORDS CAN EVER EXPLAIN! 🥹💋
                  </p>
                </div>
              </div>

              <button
                onClick={triggerPinkFireworks}
                className="mt-10 px-8 py-4 rounded-full bg-gradient-to-r from-[#FF69A6] via-[#E84383] to-[#FF69A6] text-white font-serif font-bold text-lg shadow-xl hover:shadow-pink-400 transition-all transform hover:scale-105 active:scale-95"
              >
                Launch Pink Fireworks 🎆💗
              </button>
            </section>
          </main>

          {/* FLOATING MUSIC PLAYER */}
          <div className="fixed bottom-5 left-5 z-40">
            <div className="flex items-center gap-2.5 px-4 py-2 rounded-full glass-pink shadow-lg">
              <button onClick={handleToggleMusic} className="w-8 h-8 rounded-full bg-[#E84383] text-white flex items-center justify-center text-sm shadow">
                {isPlaying ? '⏸' : '▶'}
              </button>
              <div className="text-left text-xs font-bold text-[#E84383]">
                Romantic Melody 🎵
              </div>
            </div>
          </div>

          {/* SECRET SURPRISE BUTTON */}
          <div className="fixed bottom-5 right-5 z-40">
            <button onClick={handleSecret} className="p-3 rounded-full glass-pink shadow-md text-xl hover:scale-125 transition-transform" title="A secret sparkle...">
              ✨
            </button>
          </div>

          {/* SECRET MODAL */}
          {isSecretOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm" onClick={() => setIsSecretOpen(false)}>
              <div className="bg-white p-8 rounded-3xl max-w-md text-center border-4 border-pink-300 shadow-2xl" onClick={e => e.stopPropagation()}>
                <div className="text-5xl mb-4">💖</div>
                <span className="text-xs font-bold uppercase tracking-widest text-pink-500">Secret Easter Egg Unlocked ✨</span>
                <p className="font-handwriting text-3xl text-[#E84383] font-bold mt-4 leading-snug">
                  "Guess what? I fall in love with you a little more every single day. 💗"
                </p>
                <button onClick={() => setIsSecretOpen(false)} className="mt-6 px-6 py-2.5 rounded-full bg-[#E84383] text-white font-bold text-sm">
                  Awww, I love you too! 🥹💗
                </button>
              </div>
            </div>
          )}

          {/* LIGHTBOX */}
          {activeLightbox !== null && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/85 backdrop-blur-md" onClick={() => setActiveLightbox(null)}>
              <div className="max-w-2xl bg-white p-4 rounded-2xl border-4 border-pink-200 text-center" onClick={e => e.stopPropagation()}>
                <img src={photos[activeLightbox].url} alt="" className="max-h-[70vh] rounded-xl mx-auto object-contain" />
                <p className="font-handwriting text-2xl text-[#E84383] font-bold mt-3">
                  {photos[activeLightbox].caption}
                </p>
                <div className="flex justify-between items-center mt-3">
                  <button onClick={() => setActiveLightbox((activeLightbox - 1 + photos.length) % photos.length)} className="px-4 py-1.5 rounded-full bg-pink-100 text-[#E84383] text-xs font-bold">
                    ← Previous
                  </button>
                  <button onClick={() => setActiveLightbox(null)} className="px-4 py-1.5 rounded-full bg-[#E84383] text-white text-xs font-bold">
                    Close
                  </button>
                  <button onClick={() => setActiveLightbox((activeLightbox + 1) % photos.length)} className="px-4 py-1.5 rounded-full bg-pink-100 text-[#E84383] text-xs font-bold">
                    Next →
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* ADMIN STUDIO MODAL */}
          {isAdminOpen && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-black/75 backdrop-blur-md">
              <div className="bg-white p-6 rounded-3xl max-w-xl w-full border-4 border-pink-300 shadow-2xl">
                {!isAdminAuthed ? (
                  <div className="text-center">
                    <h3 className="font-serif font-bold text-xl text-[#E84383]">Customization Studio 👑</h3>
                    <p className="text-xs text-slate-500 mt-1 mb-4">Enter password (default: love123)</p>
                    <input
                      type="password"
                      placeholder="Password"
                      value={adminPass}
                      onChange={e => setAdminPass(e.target.value)}
                      className="px-4 py-2 border rounded-xl text-center text-sm w-full mb-3"
                    />
                    <div className="flex gap-2 justify-center">
                      <button
                        onClick={() => {
                          if (adminPass === 'love123' || adminPass === 'forever') setIsAdminAuthed(true);
                          else alert('Incorrect password. Default is: love123');
                        }}
                        className="px-6 py-2 rounded-full bg-[#E84383] text-white font-bold text-xs"
                      >
                        Unlock Studio
                      </button>
                      <button onClick={() => setIsAdminOpen(false)} className="px-4 py-2 text-xs text-slate-500">Cancel</button>
                    </div>
                  </div>
                ) : (
                  <div>
                    <div className="flex justify-between items-center mb-4">
                      <h3 className="font-serif font-bold text-lg text-[#E84383]">Photo Management 📸</h3>
                      <button onClick={() => setIsAdminOpen(false)} className="text-slate-500 text-sm font-bold">✕ Close</button>
                    </div>
                    <label className="block p-4 border-2 border-dashed border-pink-300 rounded-xl text-center cursor-pointer bg-pink-50 mb-4">
                      <span className="text-xs font-bold text-[#E84383]">Click to Upload Boyfriend Photos</span>
                      <input type="file" multiple accept="image/*" className="hidden" onChange={handlePhotoUpload} />
                    </label>
                    <div className="max-h-60 overflow-y-auto space-y-2">
                      {photos.map((p, idx) => (
                        <div key={p.id} className="flex items-center justify-between p-2 bg-slate-50 rounded-lg text-xs">
                          <span className="font-semibold text-slate-700">{p.caption}</span>
                          <button
                            onClick={() => setPhotos(prev => prev.map((item, i) => ({ ...item, isFavorite: i === idx })))}
                            className={`px-2 py-1 rounded ${p.isFavorite ? 'bg-amber-400 text-white font-bold' : 'bg-slate-200 text-slate-600'}`}
                          >
                            {p.isFavorite ? '👑 Favourite' : 'Set as Finale'}
                          </button>
                        </div>
                      ))}
                    </div>
                    <button onClick={() => setIsAdminOpen(false)} className="w-full mt-4 py-2 rounded-xl bg-[#E84383] text-white font-bold text-xs">
                      Save & Preview Website
                    </button>
                  </div>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
